name: unit_tests

on:
  pull_request:

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: make install
        working-directory: ./tests
      - name: Run unit tests
        run: make unit-test
        working-directory: ./tests
